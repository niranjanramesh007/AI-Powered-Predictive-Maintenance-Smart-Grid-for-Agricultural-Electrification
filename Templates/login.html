<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login | Smart Farm AI</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #1b5e20 0%, #4caf50 100%);
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center; margin: 0;
        }
        .login-card {
            background: white; padding: 40px; border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3); width: 100%; max-width: 400px;
            text-align: center; border-top: 5px solid #d4af37;
        }
        .logo { font-size: 28px; font-weight: 700; color: #2e5a1c; text-decoration: none; display: block; margin-bottom: 10px; }
        .form-group { margin-bottom: 20px; text-align: left; }
        .form-group label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 5px; color: #555; }
        input { width: 100%; padding: 12px; border: 2px solid #eee; border-radius: 8px; box-sizing: border-box; }
        .btn-login { width: 100%; padding: 14px; background: #2e5a1c; color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; }
        .btn-login:hover { background: #43a047; }
    </style>
</head>
<body>
    <div class="login-card">
        <a href="/" class="logo"><i class="fas fa-leaf"></i> Smart Farm</a>
        <p style="color:#666; margin-bottom:30px;">Welcome back!</p>
        <form action="/login" method="POST">
            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" placeholder="farmer@gmail.com" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-login">Sign In</button>
        </form>
        <div style="margin-top: 20px; font-size: 12px;">
            <a href="/" style="color: #2e5a1c; text-decoration: none;">Back to Home</a>
        </div>
    </div>
</body>
</html>
